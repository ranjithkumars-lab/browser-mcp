# Enterprise MCP Server deployment.

apiVersion: v1
kind: ConfigMap
metadata:
  name: enterprise-mcp-config
  labels:
    app: enterprise-mcp
data:
  ENTERPRISE_MCP_ENV: production
  ENTERPRISE_MCP_SERVER__TRANSPORTS__HOST: 0.0.0.0
  ENTERPRISE_MCP_SERVER__TRANSPORTS__PORT: "8000"
  ENTERPRISE_MCP_SERVER__OBSERVABILITY__LOGGING__FORMAT: json
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-mcp
  labels:
    app: enterprise-mcp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: enterprise-mcp
  template:
    metadata:
      labels:
        app: enterprise-mcp
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: enterprise-mcp
          image: ghcr.io/your-org/enterprise-mcp-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: enterprise-mcp-config
          env:
            - name: ENTERPRISE_MCP_SERVER__SECURITY__API_KEY
              valueFrom:
                secretKeyRef:
                  name: enterprise-mcp-secrets
                  key: api-key
                  optional: true
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: enterprise-mcp
  labels:
    app: enterprise-mcp
spec:
  selector:
    app: enterprise-mcp
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
