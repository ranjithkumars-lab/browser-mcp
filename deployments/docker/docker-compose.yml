services:
  # Browser MCP Server (Streamable HTTP transport) - exposes the browser tools
  mcp-server:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    image: browser-mcp-server:latest
    environment:
      BROWSER_MCP_ENV: development
      PLAYWRIGHT_BROWSERS_PATH: /opt/ms-playwright
    ports:
      - "8001:8000"
    volumes:
      - ./config:/app/config:ro
    restart: unless-stopped
    entrypoint: ["browser-mcp"]
    command: ["mcp", "serve", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Browser MCP REST API + Control Center UI
  browser-api:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    image: browser-mcp-server:latest
    environment:
      BROWSER_MCP_ENV: development
      PLAYWRIGHT_BROWSERS_PATH: /opt/ms-playwright
      BROWSER_MCP_OLLAMA__HOST: ${BROWSER_MCP_OLLAMA__HOST:-http://10.0.0.170:11444}
      BROWSER_MCP_OLLAMA__MODEL: ${BROWSER_MCP_OLLAMA__MODEL:-gpt-oss:20b}
      BROWSER_MCP_OLLAMA__TIMEOUT_SECONDS: ${BROWSER_MCP_OLLAMA__TIMEOUT_SECONDS:-300}
      BROWSER_MCP_OLLAMA__KEEP_ALIVE: ${BROWSER_MCP_OLLAMA__KEEP_ALIVE:-30m}
    ports:
      - "8081:8080"
    volumes:
      - ./config:/app/config:ro
      - ui-dist:/app/ui/dist
    restart: unless-stopped
    entrypoint: ["browser-mcp"]
    command: ["api", "serve", "--host", "0.0.0.0", "--port", "8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      mcp-server:
        condition: service_healthy

  # Redis for worker queue (optional)
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Distributed Worker (optional)
  worker:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    image: browser-mcp-server:latest
    environment:
      BROWSER_MCP_ENV: development
      PLAYWRIGHT_BROWSERS_PATH: /opt/ms-playwright
      REDIS_URI: redis://redis:6379/0
    volumes:
      - ./config:/app/config:ro
    restart: unless-stopped
    entrypoint: ["browser-mcp"]
    command: ["worker", "start", "--queues", "high,default,low", "--concurrency", "2"]
    depends_on:
      redis:
        condition: service_healthy
      mcp-server:
        condition: service_healthy

volumes:
  redis-data:
  ui-dist: