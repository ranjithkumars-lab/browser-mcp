[project]
name = "enterprise-mcp-server"
version = "0.1.0"
description = "Production-ready, transport-independent foundation for building enterprise MCP servers."
readme = "README.md"
authors = [
    { name = "Ranjithkumar Sekar", email = "ranjithks@am.amrita.edu" }
]
license = { text = "MIT" }
requires-python = ">=3.13"
keywords = ["mcp", "model-context-protocol", "enterprise", "template", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "mcp>=1.2,<2.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "pyyaml>=6.0,<7.0",
    "structlog>=24.4,<26.0",
    "typer>=0.15,<1.0",
    "httpx>=0.28,<1.0",
    "platformdirs>=4.3,<5.0",
    "playwright>=1.62.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.9,<1.0",
    "pyright>=1.1.390,<2.0",
    "pre-commit>=4.0,<5.0",
    "mkdocs>=1.6,<2.0",
    "mkdocs-material>=9.5,<10.0",
    "httpx>=0.28,<1.0",
]
docs = [
    "mkdocs>=1.6,<2.0",
    "mkdocs-material>=9.5,<10.0",
]

[project.scripts]
enterprise-mcp = "enterprise_mcp.cli.main:app"

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["enterprise_mcp", "browser_mcp"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "S",   # flake8-bandit (security)
    "SIM", # flake8-simplify
    "N",   # pep8-naming
    "RUF", # ruff-specific
]
ignore = [
    "S101",  # assert allowed in tests and debug code
    "S104",  # binding to 0.0.0.0 is intentional for servers
    "S105",  # hardcoded password strings are not used as secrets
    "S106",  # hardcoded password arguments are not used as secrets
    "S107",  # hardcoded default arguments are not used as secrets
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers -q"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "e2e: end-to-end tests",
    "slow: slow tests",
]

[tool.pyright]
pythonVersion = "3.13"
pythonPlatform = "All"
typeCheckingMode = "strict"
include = ["src", "tests"]
exclude = ["tests/**"]
reportMissingTypeStubs = "warning"
reportMissingImports = "error"

[tool.coverage.run]
source = ["enterprise_mcp"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 80
