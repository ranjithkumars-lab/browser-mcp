<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Shadow DOM Page</title>
</head>
<body>
  <h1>Shadow DOM</h1>
  <div id="host"></div>
  <div id="light-dom">light content</div>

  <script>
    const host = document.getElementById('host');
    const root = host.attachShadow({ mode: 'open' });
    root.innerHTML = `
      <style> .inner { color: green; } </style>
      <div id="shadow-wrapper">
        <p class="inner" data-kind="shadow">shadow text</p>
        <button id="shadow-button">Shadow Button</button>
      </div>
    `;
  </script>
</body>
</html>
