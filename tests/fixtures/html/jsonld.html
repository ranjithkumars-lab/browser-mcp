<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>JSON-LD Fixture Page</title>

  <!-- Product JSON-LD -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org/",
    "@type": "Product",
    "name": "Acme Coffee Maker",
    "description": "Brew the perfect cup of coffee with this premium espresso machine.",
    "sku": "CM-2024",
    "brand": {
      "@type": "Brand",
      "name": "Acme"
    },
    "offers": {
      "@type": "Offer",
      "price": "129.99",
      "priceCurrency": "USD",
      "availability": "https://schema.org/InStock",
      "url": "https://example.com/products/coffee-maker"
    }
  }
  </script>

  <!-- Organization JSON-LD -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org/",
    "@type": "Organization",
    "name": "Example Store",
    "url": "https://www.example.com"
  }
  </script>

  <!-- Graph with multiple products -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org/",
    "@graph": [
      {
        "@type": "Product",
        "name": "Wireless Headphones",
        "description": "Noise-cancelling Bluetooth headphones.",
        "sku": "HP-100",
        "offers": {
          "@type": "Offer",
          "price": "199.99",
          "priceCurrency": "USD"
        }
      },
      {
        "@type": "Article",
        "name": "Understanding JSON-LD",
        "description": "A guide to structured data."
      }
    ]
  }
  </script>

  <!-- Breadcrumb JSON-LD -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org/",
    "@type": "BreadcrumbList",
    "itemListElement": [
      { "@type": "ListItem", "position": 1, "name": "Home" },
      { "@type": "ListItem", "position": 2, "name": "Products" }
    ]
  }
  </script>
</head>
<body>
  <h1>JSON-LD Fixture</h1>
  <p>This page contains multiple JSON-LD blocks for testing.</p>
</body>
</html>
