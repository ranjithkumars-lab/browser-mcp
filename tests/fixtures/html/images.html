<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Images Fixture Page</title>
</head>
<body>
  <h1>Images Fixture</h1>

  <figure>
    <img src="/assets/hero-banner.jpg" alt="Hero Banner" width="1200" height="400" loading="eager">
  </figure>

  <figure>
    <img src="/assets/logo.png" alt="Company Logo" width="200" height="60" loading="lazy">
  </figure>

  <figure>
    <img src="https://cdn.example.com/assets/photo.jpg" alt="Remote Photo" loading="lazy">
  </figure>

  <figure>
    <img src="" alt="Broken Image" loading="lazy">
  </figure>

  <figure>
    <img src="/assets/decorative.png" alt="" loading="lazy">
  </figure>

  <figure>
    <img src="/assets/avatar.webp" alt="User Avatar" width="48" height="48" loading="lazy">
    <figcaption>Avatar image</figcaption>
  </figure>

  <div style="display:none;">
    <img src="/assets/hidden.jpg" alt="Hidden image" loading="lazy">
  </div>
</body>
</html>
