<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Table Fixture Page</title>
</head>
<body>
  <h1>Tables Fixture</h1>

  <table id="main-table">
    <caption>Employee Directory</caption>
    <thead>
      <tr>
        <th>Name</th>
        <th>Department</th>
        <th>Start Date</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Alice Smith</td>
        <td>Engineering</td>
        <td>2020-01-15</td>
      </tr>
      <tr>
        <td>Bob Jones</td>
        <td>Marketing</td>
        <td>2019-03-22</td>
      </tr>
      <tr>
        <td>Carol Lee</td>
        <td>Engineering</td>
        <td>2021-07-10</td>
      </tr>
    </tbody>
  </table>

  <table id="simple-table">
    <tr>
      <td>cell1</td>
      <td>cell2</td>
    </tr>
    <tr>
      <td>cell3</td>
      <td>cell4</td>
    </tr>
  </table>

  <table id="empty-table">
    <thead>
      <tr><th>A</th><th>B</th></tr>
    </thead>
    <tbody></tbody>
  </table>
</body>
</html>
