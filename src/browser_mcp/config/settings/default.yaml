browser:
  engine: chromium
  headless: true
  slow_mo: 0
  viewport:
    width: 1280
    height: 720
  locale: null
  timezone: null
  downloads_dir: null
  user_agent: null
  ignore_https_errors: false

pool:
  max_browsers: 10
  max_contexts_per_browser: 10
  max_pages_per_context: 50

profiles:
  directory: "~/.browser-mcp/profiles"
  default_profile: temporary
  default_persistent: false
