browser:
  engine: chromium
  headless: true
  slow_mo: 0
  viewport:
    width: 1280
    height: 720
  locale: null
  timezone: null
  downloads_dir: null
  user_agent: null
  ignore_https_errors: false

pool:
  max_browsers: 10
  max_contexts_per_browser: 10
  max_pages_per_context: 50

profiles:
  directory: "~/.browser-mcp/profiles"
  default_profile: temporary
  default_persistent: false

navigation:
  allowed_domains: []
  blocked_domains: []
  allow_redirects: true
  max_redirects: 10
  allowed_schemes: ["http", "https", "file"]
  default_strategy: normal
  blocked_extensions: []
  allowed_ports: []
  max_navigation_depth: null

timeouts:
  default_timeout_ms: 30000
  navigation_timeout_ms: 30000
  interaction_timeout_ms: 10000
  wait_timeout_ms: 10000

transfer:
  download_directory: "~/.browser-mcp/artifacts"
  max_file_size_bytes: 524288000
  allowed_extensions: []
  allowed_mime_types: []
  checksum_algorithm: sha256
  collision_strategy: auto_rename
  cleanup_policy: on_failure

events:
  max_history_size: 1000
  max_queue_size: 10000
  subscriber_timeout_seconds: 5.0
  worker_count: 4
  drop_policy: drop_oldest
  enable_metrics: true
  enable_streaming: true

plugins:
  plugin_directory: "~/.browser-mcp/plugins"
  auto_discover: true
  auto_reload: true
  marketplace_enabled: false
  verify_signatures: false
  allow_unsigned: true
  max_execution_time_seconds: 30.0
  max_memory_mb: 256

server:
  default_transport: stdio
  protocol_version: "2025-06"
  host: 127.0.0.1
  port: 8000
  request_timeout: 30.0
  max_connections: 100
  stream_buffer_size: 1000
  enable_notifications: true
  enable_resources: false
  enable_prompts: false

api:
  host: 0.0.0.0
  port: 8080
  api_key: null
  request_timeout: 30.0
  enable_docs: true
  enable_redoc: false
  enable_health: true
  enable_metrics: true
  job_retention_minutes: 60
  max_jobs: 1000
  default_sync_timeout: 5.0

ui:
  static_directory: ui/dist
  websocket_path: /api/v1/dashboard/ws
  reconnect_delay_ms: 1000
  event_buffer_size: 1000

ollama:
  host: "http://10.0.0.170:11444"
  model: "gpt-oss:20b"
  timeout_seconds: 300.0
  keep_alive: "30m"
  max_tool_steps: 8
  temperature: 0.0
