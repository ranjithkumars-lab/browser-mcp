browser:
  engine: chromium
  headless: true
  slow_mo: 0
  viewport:
    width: 1280
    height: 720

pool:
  max_browsers: 10
  max_contexts_per_browser: 10
  max_pages_per_context: 50

profiles:
  directory: "~/.browser-mcp/profiles"
  default_profile: temporary
  default_persistent: false

navigation:
  allowed_domains: []
  blocked_domains: []
  allow_redirects: true
  max_redirects: 10
  allowed_schemes: ["http", "https", "file"]
  default_strategy: normal

timeouts:
  default_timeout_ms: 30000
  navigation_timeout_ms: 30000
  interaction_timeout_ms: 10000
  wait_timeout_ms: 10000
